apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-test
  template:
    metadata:
      labels:
        app: jenkins-test
    spec:
      containers:
      - name: jenkins-test
        image: mohamed11755/jenkins-test:48
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-test-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: jenkins-test
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
